name: Notes Application CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      
jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Deps
        run: npm install
        
      - name: Run Lint
        run: |
          mkdir -p logs
          npm run test:lint 2>&1 | tee logs/lint.log

      # Failure artifact
      - if: github.ref == 'refs/heads/main' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-${{ github.sha }}
          path: logs/lint.log

      # Success artifact
      - if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v7 
        with:
          name: lint-${{ github.sha }}
          path: logs/lint.log

  unit-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Deps
        run: npm install

      - name: Run Unit Tests
        run: npm run test:unit

      # Upload test results
      - if: success()
        uses: actions/upload-artifact@v7 
        with:
          name: unit-test-${{ github.sha }}
          path: coverage/lcov-report